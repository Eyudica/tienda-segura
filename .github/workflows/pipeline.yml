name: pipeline

on: [pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4.1.7
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          fetch-depth: 0

      - run: npm ci

      - run: npm test

      - run: npm audit --audit-level=high

      - run: pip install semgrep

      - run: semgrep scan --config auto --error

      # gitleaks/gitleaks-action@v2.3.4
      - uses: gitleaks/gitleaks-action@47f07094b9bc2a02e6d62a93c990b7956ef5a5b1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
